<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" />

  <!-- Glowing Outer Tech Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="16 12" opacity="0.4" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" />

  <!-- Shield Base -->
  <path d="M 256,90 L 390,140 C 390,260 256,380 256,410 C 256,380 122,260 122,140 Z" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="12" filter="url(#glow)" />

  <!-- Internal Shield Accent -->
  <path d="M 256,120 L 360,160 C 360,250 256,350 256,375 C 256,350 152,250 152,160 Z" fill="url(#bgGrad)" opacity="0.8" />

  <!-- Code Brackets & Voice Waves -->
  <!-- Left Bracket < -->
  <path d="M 200,210 L 160,250 L 200,290" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Right Bracket > -->
  <path d="M 312,210 L 352,250 L 312,290" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central "TL" Monogram -->
  <text x="256" y="278" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="82" fill="url(#emeraldGrad)" text-anchor="middle" letter-spacing="-2">TL</text>

  <!-- Audio Pronunciation Wave Badge at Top -->
  <path d="M 230,170 Q 256,155 282,170" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" />
  <path d="M 220,155 Q 256,135 292,155" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
</svg>
